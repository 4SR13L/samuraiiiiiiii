// ==========================================
// 4. FUNÇÕES ANÔNIMAS
// ==========================================

const dividir = function(x, y) {
    return x / y;
};

// Explicação:
// - const dividir = ... → Cria uma constante chamada dividir (não pode ser reatribuída)[cite: 1].
// - function(x, y) { ... } → Função anônima que recebe x e y e retorna a divisão[cite: 1].
// - O ponto e vírgula (;) no final é necessário porque estamos fazendo uma atribuição[cite: 1].
console.log(dividir(10, 2)); // Exibe 5[cite: 1]


// ==========================================
// 5. ARROW FUNCTIONS
// ==========================================
// Forma mais curta de escrever funções no JavaScript moderno (ES6+)[cite: 1].
const subtrair = (a, b) => a - b;

// - const → Cria uma variável constante chamada "subtrair"[cite: 1].
// - (a, b) → Parâmetros da função[cite: 1].
// - => → Indica que estamos usando uma arrow function[cite: 1].
// - a - b → Corpo da função e retorno implícito (não precisa escrever "return")[cite: 1].

console.log(subtrair(10, 3)); // Exibe 7[cite: 1]


// ==========================================
// 6. FUNÇÕES DENTRO DE FUNÇÕES (NESTED)
// ==========================================
// Também chamadas de funções aninhadas[cite: 1]. 
// Uma função interna só pode ser chamada dentro da função externa[cite: 1].
function calculadora(a, b) {
    
    // Função interna 'soma', só pode ser usada dentro de 'calculadora'[cite: 1]
    function soma(x, y) {
        return x + y;
    }
    
    // Função interna 'multiplicar', só pode ser usada dentro de 'calculadora'[cite: 1]
    function multiplicar(x, y) {
        return x * y;
    }
    
    // Chama a função interna 'soma' passando os parâmetros recebidos por 'calculadora'[cite: 1]
    console.log("Soma:", soma(a, b));
    
    // Chama a função interna 'multiplicar' passando os mesmos parâmetros[cite: 1]
    console.log("Multiplicação:", multiplicar(a, b));
}

// Chama a função principal 'calculadora', passando a=4 e b=2[cite: 1]
calculadora(4, 2); 
// Saída esperada no console:
// Soma: 6
// Multiplicação: 8
