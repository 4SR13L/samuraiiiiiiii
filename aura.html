<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScribidi</title>
</head>
<body>
<script>

function mostrarMensagem() {
    console.log("Bem-vindo ao estudo de funções em JavaScript!");
}
mostrarMensagem();

function somaSimples() {
    let a = 4;
    let b = 6;
    console.log("Soma:", a + b);
}
somaSimples();

function imprimirNome() {
    let nome = "Gerard Way";
    console.log(nome);
}
imprimirNome();

function quadrado(numero) {
    return numero * numero;
}
console.log("Quadrado de 4:", quadrado(4));

function converterParaCelsius(fahrenheit) {
    return (fahrenheit - 32) / 1.8;
}
console.log("68°F em Celsius:", converterParaCelsius(68));

function concatenaPalavras(palavra1, palavra2) {
    return palavra1 + " " + palavra2;
}
console.log(concatenaPalavras("Aprender", "JavaScript é divertido"));

function calcularMedia(n1, n2, n3) {
    return (n1 + n2 + n3) / 3;
}
console.log("Média:", calcularMedia(7, 8, 9));

function desconto(valor, percentual) {
    return valor - (valor * percentual / 100);
}
console.log("Valor final:", desconto(200, 10));

function saudacaoPersonalizada(nome) {
    console.log(`Olá, ${nome}! Seja bem-vindo.`);
}
saudacaoPersonalizada("Maria");

const multiplicar = function (a, b) {
    return a * b;
};
console.log("Multiplicação:", multiplicar(3, 5));

const dividir = function (a, b) {
    return a / b;
};
console.log("Divisão:", dividir(10, 2));

const dobro = (numero) => numero * 2;
console.log("Dobro de 7:", dobro(7));

const ehPar = (numero) => numero % 2 === 0;
console.log("8 é par?", ehPar(8));
console.log("7 é par?", ehPar(7));

function calculadora(a, b) {
    function soma(x, y) {
        return x + y;
    }
    function subtrair(x, y) {
        return x - y;
    }
    console.log("Soma:", soma(a, b));
    console.log("Subtração:", subtrair(a, b));
}
calculadora(10, 4);

function operacoesAvancadas(a, b) {
    function produto(x, y) {
        return x * y;
    }
    function potencia(x, y) {
        return x ** y;
    }
    return {
        produto: produto(a, b),
        potencia: potencia(a, b)
    };
}
console.log(operacoesAvancadas(2, 5));

</script>
</body>
</html>
